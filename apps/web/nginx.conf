server {
  listen 80;
  server_name _;
  charset utf-8;
  root /usr/share/nginx/html;
  # Bot answers stream as Server-Sent Events: no buffering, long read timeout.
  location /api/chat/ { proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 180s; }
  # AI-backed buddy endpoints (draft, knowledge gaps, KB lint) can take up to a minute or two.
  location ~ ^/api/(buddy/questions/[^/]+/draft|analytics/gaps|kb/lint)$ { proxy_pass http://backend:8080; proxy_read_timeout 240s; }
  location /api/ { proxy_pass http://backend:8080; proxy_read_timeout 15s; }
  location / { try_files $uri $uri/ /index.html; }
}
