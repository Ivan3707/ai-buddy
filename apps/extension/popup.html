<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><title>AI-buddy</title><link rel="stylesheet" href="popup.css"></head>
<body>
<h1>AI-buddy</h1>
<section id="session-section" aria-live="polite">
  <p id="session-message">Проверяем сессию…</p>
  <button id="retry-session" type="button" class="secondary" hidden>Проверить снова</button>
</section>
<section id="login-section" hidden>
  <p>Войдите, чтобы использовать AI-помощника.</p>
  <form id="login">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button>Войти</button>
  </form>
  <p id="login-error" class="error" role="alert" aria-live="polite"></p>
</section>
<section id="assistant-section" hidden>
  <div class="account"><span id="account-email"></span><button id="logout" type="button" class="secondary">Выйти</button></div>
  <p>Демо: спросите про отпуск или доступ.</p>
  <form id="chat"><label for="message">Ваш вопрос</label><textarea id="message" maxlength="2000" required>Как оформить отпуск?</textarea><button>Отправить</button></form>
  <div id="reply" aria-live="polite"></div>
</section>
<p class="footnote">Mock AI · Без доступа к содержимому вкладок</p>
<script type="module" src="popup.js"></script>
</body>
</html>
