name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_USER: app
      DB_PASSWORD: ci_only_database_password
      DB_NAME: app
      JWT_SECRET: ci_only_jwt_secret_replace_in_real_environments_123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Start PostgreSQL
        run: docker compose -p ai-buddy-ci up -d --wait postgres

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1

      - name: Apply application migrations
        run: |
          application_url="postgres://${DB_USER}:${DB_PASSWORD}@127.0.0.1:5433/${DB_NAME}?sslmode=disable"
          goose -dir apps/backend/migrations postgres "$application_url" up

      - name: Start isolated PostgreSQL for Go tests
        run: |
          test_db_container="ai-buddy-ci-go-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          report_test_db_failure() {
            status=$?
            echo "::group::Temporary PostgreSQL logs"
            docker logs "$test_db_container" 2>&1 || true
            echo "::endgroup::"
            exit "$status"
          }
          trap report_test_db_failure ERR
          docker run --rm -d --name "$test_db_container" \
            --tmpfs /var/lib/postgresql/data:rw,size=256m \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=ai_buddy_verify_ci \
            -p 127.0.0.1::5432 postgres:16-alpine >/dev/null
          ready=0
          for attempt in {1..30}; do
            if docker logs "$test_db_container" 2>&1 \
                | grep -q 'PostgreSQL init process complete; ready for start up.' \
              && docker exec "$test_db_container" pg_isready -h 127.0.0.1 \
                -U postgres -d ai_buddy_verify_ci >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          test_db_port="$(docker port "$test_db_container" 5432/tcp)"
          test_db_port="${test_db_port##*:}"
          [[ "$test_db_port" =~ ^[0-9]+$ ]]
          test_database_url="postgres://postgres@127.0.0.1:${test_db_port}/ai_buddy_verify_ci?sslmode=disable"
          test_catalog_database_url="postgres://postgres@127.0.0.1:${test_db_port}/ai_buddy_verify_catalog?sslmode=disable"
          docker exec "$test_db_container" psql -h 127.0.0.1 \
            -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE ai_buddy_verify_catalog' >/dev/null
          goose -dir apps/backend/migrations postgres "$test_database_url" up
          goose -dir apps/backend/migrations postgres "$test_catalog_database_url" up
          printf 'TEST_DATABASE_URL=%s\nTEST_CATALOG_DATABASE_URL=%s\n' \
            "$test_database_url" "$test_catalog_database_url" >> "$GITHUB_ENV"

      - name: Go tests and vet
        working-directory: apps/backend
        run: |
          go version
          gcc --version
          go test -p 1 -count=1 ./...
          CGO_ENABLED=1 RUN_E2E=1 go test -race -p 1 -count=1 ./...
          go vet ./...
          test -z "$(gofmt -l .)"

      - name: AI tests
        run: |
          python -m pip install -r apps/ai/requirements-dev.txt
          cd apps/ai
          python -m pytest -q

      - name: Contract checks and frontend build
        run: |
          python scripts/check_contracts.py
          npm ci
          npm test
          npm run build

      - name: Initialize catalog and sync Mock HR
        working-directory: apps/backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5433"
          DB_SSLMODE: disable
        run: |
          go run ./cmd/init-catalog
          go run ./cmd/sync-hr -credentials "$RUNNER_TEMP/ai-buddy-ci-credentials.json"
          echo "E2E_CREDENTIALS_FILE=$RUNNER_TEMP/ai-buddy-ci-credentials.json" >> "$GITHUB_ENV"

      - name: Start application stack
        run: docker compose -p ai-buddy-ci up --build -d --wait

      - name: Live contract checks
        run: CHECK_LIVE=1 python scripts/check_contracts.py

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/**/mv3-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Service logs on failure
        if: failure()
        run: docker compose -p ai-buddy-ci logs --no-color

      - name: Stop temporary Go test PostgreSQL
        if: always()
        run: docker stop "ai-buddy-ci-go-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true

      - name: Stop test stack
        if: always()
        run: docker compose -p ai-buddy-ci down
