name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - name: Go tests and vet
        working-directory: apps/backend
        run: |
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l .)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai/requirements*.txt
      - run: python -m pip install -r apps/ai/requirements-dev.txt
      - name: AI tests
        working-directory: apps/ai
        run: python -m pytest -q
      - run: python scripts/check_contracts.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: docker compose -p ai-buddy-ci up --build -d --wait
      - name: Live contract tests
        run: CHECK_LIVE=1 python scripts/check_contracts.py
      - run: npm run test:e2e
      - name: Service logs on failure
        if: failure()
        run: docker compose -p ai-buddy-ci logs --no-color
      - name: Stop test stack
        if: always()
        run: docker compose -p ai-buddy-ci down
