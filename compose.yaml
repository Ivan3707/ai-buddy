services:
  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_EXTRA_BODY: ${LLM_FALLBACK_EXTRA_BODY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_FIRST_BYTE_TIMEOUT_SECONDS: ${LLM_FIRST_BYTE_TIMEOUT_SECONDS:-15}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      RAG_MODE: ${RAG_MODE:-hybrid}
      ANSWER_CACHE_TTL_SECONDS: ${ANSWER_CACHE_TTL_SECONDS:-3600}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-0}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.2}
      KB_STALE_DAYS: ${KB_STALE_DAYS:-365}
      KB_TODAY: ${KB_TODAY:-}
      KB_LINT_MAX_LLM_CALLS: ${KB_LINT_MAX_LLM_CALLS:-15}
      KB_SOURCE: ${KB_SOURCE:-markdown}
      CONFLUENCE_URL: ${CONFLUENCE_URL:-}
      CONFLUENCE_TOKEN: ${CONFLUENCE_TOKEN:-}
      CONFLUENCE_SPACE: ${CONFLUENCE_SPACE:-}
      KB_RELOAD_SECONDS: ${KB_RELOAD_SECONDS:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: on-failure
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      AI_URL: http://ai:8001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured}
      DB_NAME: ${DB_NAME:-app}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
    depends_on:
      ai:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:${WEB_PORT:-5173}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured}
      POSTGRES_DB: ${DB_NAME:-app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
