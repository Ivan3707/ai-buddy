# All automated tests with coverage, only Docker required (no Go, Python or Node on the host):
#
#   docker compose -f compose.test.yaml run --rm go       # Go: unit + PostgreSQL integration + E2E
#   docker compose -f compose.test.yaml run --rm python   # Python AI service
#   docker compose -f compose.test.yaml run --rm node     # Web (React), Chrome extension, API client
#
# Go tests use a throwaway PostgreSQL in tmpfs, never the application database. Coverage reports are
# written to ./coverage/ (go/, ai/, web/, extension/, client/), each suite fails below 80% line coverage.
# Clean up: docker compose -f compose.test.yaml down -v
name: ai-buddy-tests

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ai_buddy_verify_backend
    tmpfs:
      - /var/lib/postgresql/data:rw,size=256m
    volumes:
      # The catalog CLI test needs a second, empty database.
      - ./scripts/test-db-init.sql:/docker-entrypoint-initdb.d/10-catalog-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_buddy_verify_backend"]
      interval: 2s
      timeout: 3s
      retries: 30

  go:
    image: golang:1.26
    working_dir: /repo/apps/backend
    volumes:
      - .:/repo
      - go-cache:/root/go
    environment:
      TEST_DATABASE_URL: postgres://postgres@test-db:5432/ai_buddy_verify_backend?sslmode=disable
      TEST_CATALOG_DATABASE_URL: postgres://postgres@test-db:5432/ai_buddy_verify_catalog?sslmode=disable
      RUN_E2E: "1"
    depends_on:
      test-db:
        condition: service_healthy
    entrypoint: ["sh", "/repo/scripts/test-go.sh"]

  python:
    image: python:3.12-slim
    working_dir: /repo/apps/ai
    volumes:
      - .:/repo
      - pip-cache:/root/.cache/pip
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["sh", "/repo/scripts/test-python.sh"]

  node:
    image: node:22-bookworm-slim
    working_dir: /repo
    volumes:
      - .:/repo
      # Linux node_modules live in volumes so they never mix with the host's Windows/macOS install.
      - node-modules:/repo/node_modules
      - web-node-modules:/repo/apps/web/node_modules
    entrypoint: ["sh", "/repo/scripts/test-node.sh"]

  # Not a test: builds the Chrome extension into apps/extension/dist without Node on the host.
  #   docker compose -f compose.test.yaml run --rm extension
  # BACKEND_ORIGIN must match BACKEND_PORT from .env (default http://127.0.0.1:8080).
  extension:
    image: node:22-bookworm-slim
    working_dir: /repo
    volumes:
      - .:/repo
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://127.0.0.1:8080}
    entrypoint: ["node", "apps/extension/build.mjs"]

volumes:
  go-cache:
  pip-cache:
  node-modules:
  web-node-modules:
