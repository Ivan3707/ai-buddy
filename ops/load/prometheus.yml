global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ai-buddy-load-backend
    metrics_path: /metrics
    static_configs:
      - targets: [backend:8080]

  - job_name: ai-buddy-load-postgres
    metrics_path: /metrics
    static_configs:
      - targets: [postgres-exporter:9187]
